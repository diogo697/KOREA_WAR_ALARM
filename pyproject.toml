[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korea-war-alarm"
version = "0.1.0"
description = "Public-source Korean peninsula incident monitoring and integration API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.54.0", "httpx==0.28.1",
  "pydantic==2.13.5", "feedparser==6.0.14", "PyYAML==6.0.3",
  "websockets==17.1",
]

[project.optional-dependencies]
desktop = ["plyer==2.1.0"]
mqtt = ["paho-mqtt==2.1.0"]
bundle = ["pyinstaller==6.22.3", "plyer==2.1.0", "paho-mqtt==2.1.0"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]

[project.scripts]
kwa = "korea_war_alarm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/korea_war_alarm"]

[tool.hatch.build]
exclude = ["/.local-docs", "/dist", "/build"]
