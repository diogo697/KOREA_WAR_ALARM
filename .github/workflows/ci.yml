name: verify-and-package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.8.5
      - run: uv sync --locked --extra dev --extra bundle
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv run kwa replay tests/fixtures/synthetic_attack.json
      - run: uv run kwa replay tests/fixtures/historical_dprk_2017.json
      - run: uv run kwa replay tests/fixtures/source_v2_nonwar.json
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
        working-directory: web
      - run: npm test
        if: runner.os == 'Linux'
        working-directory: web
      - run: uv run python scripts/build_release.py
      - run: uv run python scripts/smoke_release.py dist/kwa/kwa.exe
        if: runner.os == 'Windows'
      - run: uv run python scripts/smoke_release.py dist/kwa/kwa
        if: runner.os != 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: kwa-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/*.sha256 --draft --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
